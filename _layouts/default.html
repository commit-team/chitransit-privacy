<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

{% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <meta name="theme-color" content="#157878">
    <!--
      The default jekyll-theme-minimal layout inserts a "View the Project on GitHub" header link
      and a "This project is maintained by ..." footer. These are legal documents; a source-repo
      link belongs on a code page, not on a privacy policy or terms of service. Both are omitted
      here.
    -->
  </head>
  <body>
    <div class="wrapper">
      <header>
        <h1><a href="{{ '/' | absolute_url }}">{{ site.title | default: site.github.repository_name }}</a></h1>
        {% if site.description %}<p>{{ site.description }}</p>{% endif %}
      </header>
      <section>

      {{ content }}

      </section>
    </div>
    <script src="{{ '/assets/js/scale.fix.js' | relative_url }}"></script>
  </body>
</html>
